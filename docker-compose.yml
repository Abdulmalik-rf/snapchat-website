# نشر على VPS (Hostinger أو أي مزوّد): التطبيق + Caddy لشهادات HTTPS التلقائية
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://localhost}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_SALLA_STORE_URL: ${NEXT_PUBLIC_SALLA_STORE_URL:-}
        NEXT_PUBLIC_BG_VIDEO: ${NEXT_PUBLIC_BG_VIDEO:-}
        NEXT_PUBLIC_BG_VIDEO_WEBM: ${NEXT_PUBLIC_BG_VIDEO_WEBM:-}
        NEXT_PUBLIC_BG_POSTER: ${NEXT_PUBLIC_BG_POSTER:-}
        NEXT_PUBLIC_BG_MODE: ${NEXT_PUBLIC_BG_MODE:-scrub}
    env_file: .env
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # النطاق المؤقت للـ VPS (مثال: srv123456.hstgr.cloud) أو نطاقك الحقيقي
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
